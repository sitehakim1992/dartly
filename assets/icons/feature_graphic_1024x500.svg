<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F0C29"/>
      <stop offset="45%" style="stop-color:#302B63"/>
      <stop offset="100%" style="stop-color:#1A0E3E"/>
    </linearGradient>
    <linearGradient id="gPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667EEA"/>
      <stop offset="100%" style="stop-color:#764BA2"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#11998E"/>
      <stop offset="100%" style="stop-color:#38EF7D"/>
    </linearGradient>
    <linearGradient id="gOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F7971E"/>
      <stop offset="100%" style="stop-color:#FFD200"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4776E6"/>
      <stop offset="100%" style="stop-color:#8E54E9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="url(#heroBg)"/>

  <!-- Decorative circles -->
  <circle cx="0" cy="0" r="300" fill="#667EEA" opacity="0.07"/>
  <circle cx="1024" cy="500" r="350" fill="#764BA2" opacity="0.07"/>
  <circle cx="900" cy="50" r="200" fill="#38EF7D" opacity="0.05"/>
  <circle cx="150" cy="420" r="160" fill="#4776E6" opacity="0.05"/>

  <!-- Grid dots -->
  <g opacity="0.12" fill="#FFFFFF">
    <circle cx="50" cy="60" r="2.5"/><circle cx="90" cy="60" r="2.5"/><circle cx="130" cy="60" r="2.5"/>
    <circle cx="50" cy="100" r="2.5"/><circle cx="90" cy="100" r="2.5"/>
    <circle cx="880" cy="420" r="2.5"/><circle cx="920" cy="420" r="2.5"/><circle cx="960" cy="420" r="2.5"/>
    <circle cx="880" cy="460" r="2.5"/><circle cx="920" cy="460" r="2.5"/>
  </g>

  <!-- Left section: Branding -->
  <g>
    <!-- Mini icon -->
    <rect x="60" y="100" width="72" height="72" rx="18" fill="url(#gPrimary)" opacity="0.9"/>
    <polygon points="82,136 116,112 150,136 116,160" fill="white" opacity="0.95"/>
    <circle cx="116" cy="136" r="9" fill="url(#gGreen)"/>

    <!-- App name -->
    <text x="60" y="222"
      font-family="'Helvetica Neue', Arial, sans-serif"
      font-weight="900"
      font-size="58"
      letter-spacing="-2"
      fill="white">Dartly</text>

    <!-- Tagline -->
    <text x="62" y="268"
      font-family="'Helvetica Neue', Arial, sans-serif"
      font-weight="400"
      font-size="22"
      fill="#A0A0D0">Master Dart · From Zero to Expert</text>

    <!-- Feature chips -->
    <rect x="62" y="295" width="136" height="34" rx="17" fill="url(#gBlue)" opacity="0.8"/>
    <text x="130" y="317" text-anchor="middle"
      font-family="'Helvetica Neue', Arial, sans-serif"
      font-weight="700" font-size="13" fill="white">🌱 Beginner</text>

    <rect x="210" y="295" width="160" height="34" rx="17" fill="url(#gGreen)" opacity="0.8"/>
    <text x="290" y="317" text-anchor="middle"
      font-family="'Helvetica Neue', Arial, sans-serif"
      font-weight="700" font-size="13" fill="white">⚡ Intermediate</text>

    <rect x="382" y="295" width="136" height="34" rx="17" fill="url(#gOrange)" opacity="0.8"/>
    <text x="450" y="317" text-anchor="middle"
      font-family="'Helvetica Neue', Arial, sans-serif"
      font-weight="700" font-size="13" fill="white">🔥 Advanced</text>

    <!-- Stats row -->
    <text x="66" y="380"
      font-family="'Helvetica Neue', Arial, sans-serif"
      font-weight="700" font-size="36" fill="#667EEA">60</text>
    <text x="106" y="380"
      font-family="'Helvetica Neue', Arial, sans-serif"
      font-weight="400" font-size="14" fill="#8080B0"> Lessons</text>

    <text x="186" y="380"
      font-family="'Helvetica Neue', Arial, sans-serif"
      font-weight="700" font-size="36" fill="#38EF7D">180</text>
    <text x="238" y="380"
      font-family="'Helvetica Neue', Arial, sans-serif"
      font-weight="400" font-size="14" fill="#8080B0"> Quizzes</text>

    <text x="326" y="380"
      font-family="'Helvetica Neue', Arial, sans-serif"
      font-weight="700" font-size="36" fill="#F7971E">60</text>
    <text x="366" y="380"
      font-family="'Helvetica Neue', Arial, sans-serif"
      font-weight="400" font-size="14" fill="#8080B0"> Exercises</text>

    <!-- "Offline" badge -->
    <rect x="62" y="400" width="120" height="30" rx="15" fill="#38EF7D" opacity="0.15"/>
    <text x="122" y="420" text-anchor="middle"
      font-family="'Helvetica Neue', Arial, sans-serif"
      font-weight="700" font-size="12" fill="#38EF7D">✓ 100% Offline</text>

    <rect x="194" y="400" width="130" height="30" rx="15" fill="#667EEA" opacity="0.15"/>
    <text x="259" y="420" text-anchor="middle"
      font-family="'Helvetica Neue', Arial, sans-serif"
      font-weight="700" font-size="12" fill="#667EEA">✓ Dark &amp; Light</text>

    <rect x="336" y="400" width="110" height="30" rx="15" fill="#F7971E" opacity="0.15"/>
    <text x="391" y="420" text-anchor="middle"
      font-family="'Helvetica Neue', Arial, sans-serif"
      font-weight="700" font-size="12" fill="#F7971E">✓ XP System</text>
  </g>

  <!-- Right section: Mockup phone frame -->
  <g>
    <rect x="700" y="30" width="270" height="460" rx="36" fill="#1A1A2E" stroke="#3A3A5A" stroke-width="1.5"/>
    <rect x="714" y="56" width="242" height="410" rx="20" fill="#0D0D1A"/>

    <!-- Screen notch -->
    <rect x="800" y="38" width="72" height="12" rx="6" fill="#0D0D1A"/>

    <!-- Simulated screen: lesson card -->
    <!-- Header gradient -->
    <rect x="714" y="56" width="242" height="100" rx="20" fill="#302B63"/>
    <rect x="714" y="126" width="242" height="30" fill="#302B63"/>

    <!-- Header text -->
    <text x="735" y="90" font-family="'Helvetica Neue', Arial, sans-serif"
      font-weight="800" font-size="16" fill="white">Dartly</text>
    <text x="735" y="108" font-family="'Helvetica Neue', Arial, sans-serif"
      font-weight="400" font-size="10" fill="#8080B0">Master Dart from zero to hero</text>

    <!-- XP Bar -->
    <rect x="735" y="118" width="180" height="6" rx="3" fill="#2A2A4A"/>
    <rect x="735" y="118" width="120" height="6" rx="3" fill="url(#gPrimary)"/>

    <!-- Lesson cards -->
    <rect x="724" y="168" width="222" height="64" rx="12" fill="#1E1E3A" stroke="#2A2A4A" stroke-width="1"/>
    <rect x="724" y="168" width="4" height="64" rx="2" fill="url(#gBlue)"/>
    <text x="742" y="189" font-family="'Helvetica Neue', Arial, sans-serif"
      font-weight="700" font-size="11" fill="white">Hello Dart &amp; Setup</text>
    <text x="742" y="205" font-family="'Helvetica Neue', Arial, sans-serif"
      font-weight="400" font-size="9" fill="#6060A0">🌱 Beginner · Quiz · Exercise</text>
    <text x="918" y="200" text-anchor="end" font-family="'Helvetica Neue', Arial, sans-serif"
      font-weight="700" font-size="14" fill="#38EF7D">✓</text>

    <rect x="724" y="242" width="222" height="64" rx="12" fill="#1E1E3A" stroke="#2A2A4A" stroke-width="1"/>
    <rect x="724" y="242" width="4" height="64" rx="2" fill="url(#gBlue)"/>
    <text x="742" y="263" font-family="'Helvetica Neue', Arial, sans-serif"
      font-weight="700" font-size="11" fill="white">Variables &amp; Data Types</text>
    <text x="742" y="279" font-family="'Helvetica Neue', Arial, sans-serif"
      font-weight="400" font-size="9" fill="#6060A0">🌱 Beginner · Quiz · Exercise</text>
    <text x="918" y="274" text-anchor="end" font-family="'Helvetica Neue', Arial, sans-serif"
      font-weight="700" font-size="16" fill="#6060A0">›</text>

    <rect x="724" y="316" width="222" height="64" rx="12" fill="#1E1E3A" stroke="#667EEA" stroke-width="1.5"/>
    <rect x="724" y="316" width="4" height="64" rx="2" fill="url(#gGreen)"/>
    <text x="742" y="337" font-family="'Helvetica Neue', Arial, sans-serif"
      font-weight="700" font-size="11" fill="white">Async / Await</text>
    <text x="742" y="353" font-family="'Helvetica Neue', Arial, sans-serif"
      font-weight="400" font-size="9" fill="#6060A0">⚡ Intermediate · Quiz · Exercise</text>

    <!-- Code snippet preview -->
    <rect x="724" y="396" width="222" height="58" rx="10" fill="#0D1117"/>
    <text x="737" y="414" font-family="Courier, monospace"
      font-size="9" fill="#C9D1D9">void main() {'{'}  </text>
    <text x="737" y="428" font-family="Courier, monospace"
      font-size="9" fill="#79C0FF">  print</text>
    <text x="772" y="428" font-family="Courier, monospace"
      font-size="9" fill="#C9D1D9">('Hello Dart!');</text>
    <text x="737" y="442" font-family="Courier, monospace"
      font-size="9" fill="#C9D1D9">{'}'}</text>

    <!-- Bottom tab bar -->
    <rect x="714" y="444" width="242" height="22" fill="#1A1A2E"/>
    <text x="740" y="459" font-family="'Helvetica Neue', Arial, sans-serif"
      font-size="10" fill="#667EEA" font-weight="700">🏠</text>
    <text x="782" y="459" font-family="'Helvetica Neue', Arial, sans-serif"
      font-size="10" fill="#6060A0">📚</text>
    <text x="824" y="459" font-family="'Helvetica Neue', Arial, sans-serif"
      font-size="10" fill="#6060A0">🔍</text>
    <text x="866" y="459" font-family="'Helvetica Neue', Arial, sans-serif"
      font-size="10" fill="#6060A0">👤</text>
  </g>
</svg>
